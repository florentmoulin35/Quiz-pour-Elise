<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Galops – Le quiz des cavaliers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#e7ebe2;--panel:#f7f8f3;--side:#1f3a2e;--side-ink:#e9efe3;--ink:#1d2a22;--muted:#5d6b61;
  --line:#c9d1c4;--accent:#a4662f;--accent-ink:#fff;--ok:#2d7a47;--ok-bg:#dcefe1;--ko:#b3362b;--ko-bg:#f6dcd8;
  --serif:"Alegreya",Georgia,"Times New Roman",serif;--sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a15;--panel:#1b261f;--side:#0d1511;--side-ink:#e0e8dc;--ink:#e6ece1;--muted:#9aa89e;
  --line:#2f3d34;--accent:#d08a4b;--accent-ink:#1a120a;--ok:#6fc58b;--ok-bg:#1d3526;--ko:#ee8a80;--ko-bg:#3b211e}}
:root[data-theme="dark"]{
  --bg:#121a15;--panel:#1b261f;--side:#0d1511;--side-ink:#e0e8dc;--ink:#e6ece1;--muted:#9aa89e;
  --line:#2f3d34;--accent:#d08a4b;--accent-ink:#1a120a;--ok:#6fc58b;--ok-bg:#1d3526;--ko:#ee8a80;--ko-bg:#3b211e}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--sans);min-height:100vh}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:28px 20px;display:flex;flex-direction:column;gap:18px}
aside h1{font:800 30px/1.05 var(--serif);margin:0}
aside p{margin:0;font-size:14px;opacity:.75}
.levels{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lvl{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:inherit;font:600 16px var(--sans);text-align:left;cursor:pointer}
.lvl:hover{background:rgba(255,255,255,.08)}
.lvl[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
.lvl:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid #e0a35f;outline-offset:2px}
.rosette{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--serif);
  color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18) inset}
.lvl small{display:block;font-weight:400;font-size:13px;opacity:.7}
.lvl .best{margin-left:auto;font-size:13px;opacity:.85;white-space:nowrap}
main{padding:40px clamp(18px,5vw,64px);display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,36px)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
h2{font:700 clamp(24px,3.4vw,31px)/1.2 var(--serif);margin:0 0 22px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
  font:600 17px var(--sans);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb{margin:18px 0 0;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:16px;min-height:1.5em}
.btn{margin-top:20px;padding:12px 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--sans);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.res{text-align:center}
.res .rosette{width:96px;height:96px;font-size:44px;margin:0 auto 14px;box-shadow:0 0 0 7px rgba(255,255,255,.2) inset}
.res h2{margin-bottom:8px}
.res p{margin:0 0 4px;color:var(--muted)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{padding:18px 14px;gap:12px}
  aside p{display:none}
  .levels{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .lvl{width:auto;flex:none;padding:8px 12px}
  .lvl small,.lvl .best{display:none}
  main{padding:20px 14px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>Quiz des Galops</h1>
      <p>Choisis ton niveau : les questions deviennent plus difficiles du Galop 1 au Galop 7.</p>
    </div>
    <ul class="levels" id="levels"></ul>
  </aside>
  <main><section class="card" id="card" aria-live="polite"></section></main>
</div>

<script>
const COLORS=["#8a6a3c","#7c8590","#b8892b","#2f6f8f","#4d7a3c","#7a3f8f","#a23b3b"];
const LABELS=["Débutant","Bases","Allures","Soins","Technique","Culture","Expert"];
// [question, bonne réponse, [3 mauvaises], explication]
const Q=[
[ // Galop 1
["Comment s'appelle la femelle du cheval ?","La jument",["L'étalon","La pouliche","La mule"],"La jument est la femelle adulte ; la pouliche est la jeune femelle."],
["De quel côté monte-t-on traditionnellement à cheval ?","Du côté gauche",["Du côté droit","Par l'arrière","Du côté qu'on préfère"],"On monte et on descend par la gauche, côté « montoir »."],
["Sur quel élément du harnachement le cavalier s'assoit-il ?","La selle",["La sangle","Le tapis","Le licol"],"La selle se fixe sur le dos grâce à la sangle."],
["Que mange principalement un cheval ?","De l'herbe et du foin",["De la viande","Des fruits uniquement","Du pain"],"Le cheval est un herbivore : fourrages en base, céréales en complément."],
["À quoi sert le cure-pied ?","À nettoyer l'intérieur du sabot",["À brosser la crinière","À retirer les fers","À mesurer le cheval"],"On le passe avant et après chaque séance pour retirer terre et cailloux."]
],[ // Galop 2
["Quelles sont les trois allures de base du cheval ?","Pas, trot, galop",["Pas, saut, galop","Trot, canter, saut","Pas, amble, galop"],"Le pas, le trot et le galop sont les allures naturelles."],
["Le pas est une allure à combien de temps ?","4 temps",["2 temps","3 temps","1 temps"],"Le pas marque quatre appuis distincts : c'est une allure à quatre temps."],
["Comment s'appelle la sangle qui passe sous le ventre ?","La sangle",["La martingale","La muserolle","Le poitrail"],"La sangle, attachée aux contre-sanglons, maintient la selle."],
["Où mesure-t-on la taille d'un cheval ?","Au garrot",["À la croupe","À la tête","Au jarret"],"Le garrot est le point haut entre l'encolure et le dos."],
["Un cheval à la robe baie a…","Le corps brun et les crins noirs",["Le corps blanc","Le corps gris et les crins blancs","Le corps noir et les crins clairs"],"Baie : corps brun à rouge, crins et extrémités des membres noirs."]
],[ // Galop 3
["Le trot est une allure à combien de temps ?","2 temps",["3 temps","4 temps","1 temps"],"Le trot est une allure à deux temps, par bipèdes diagonaux."],
["Le galop est une allure à combien de temps ?","3 temps",["2 temps","4 temps","5 temps"],"Trois battues, suivies d'un temps de suspension."],
["Au trot enlevé, le cavalier…","Se lève et s'assoit en rythme",["Reste assis immobile","Se tient debout","Penche en arrière"],"Il accompagne le mouvement en suivant un des deux bipèdes diagonaux."],
["Que désigne le garrot ?","La jonction entre l'encolure et le dos",["Le genou de l'antérieur","La base de la queue","Le haut de la tête"],"C'est le point de mesure de la taille du cheval."],
["Quelle est la durée moyenne de gestation d'une jument ?","Environ 11 mois",["Environ 6 mois","Environ 9 mois","Environ 14 mois"],"Elle est d'environ 335 à 340 jours, soit 11 mois."]
],[ // Galop 4
["Que signifie « vermifuger » un cheval ?","Le traiter contre les parasites internes",["Le brosser","Lui couper les crins","Le vacciner contre la grippe"],"Le vermifuge élimine les vers intestinaux."],
["Quelle est la température normale d'un cheval au repos ?","Entre 37,5 et 38,5 °C",["Entre 35 et 36 °C","Entre 39,5 et 40,5 °C","Entre 36 et 37 °C"],"Au-delà de 38,5 °C, on parle de fièvre."],
["Quelle est la fréquence cardiaque d'un cheval adulte au repos ?","28 à 40 battements/minute",["60 à 80","10 à 15","100 à 120"],"Elle augmente fortement à l'effort."],
["Quel est le rôle du maréchal-ferrant ?","Parer et ferrer les pieds",["Soigner les dents","Dresser les chevaux","Fabriquer les selles"],"Il entretient les sabots et pose les fers si nécessaire."],
["La fourbure est une atteinte…","Des pieds",["Des poumons","Des dents","De la peau"],"C'est une inflammation douloureuse du tissu qui relie l'os au sabot."]
],[ // Galop 5
["Quelles sont les dimensions du grand carré de dressage ?","60 m × 20 m",["40 m × 20 m","50 m × 25 m","80 m × 30 m"],"Le petit carré mesure 40 m × 20 m."],
["Qu'est-ce que la cession à la jambe ?","Le cheval s'écarte latéralement de la jambe",["Un recul rapide","Un saut d'obstacle","Un arrêt brusque"],"Le cheval se déplace sur deux pistes en réponse à la jambe."],
["Qu'est-ce qu'un oxer ?","Un obstacle large composé de deux plans",["Un obstacle sans barre","Un fossé d'eau","Une série de cavaletti"],"Il est formé de deux plans de barres, à jumeler pour la largeur."],
["Comment le cheval recule-t-il ?","En diagonale, à deux temps",["À trois temps","À quatre temps","Au galop inversé"],"Le reculer se fait par bipèdes diagonaux, comme le trot."],
["Que mesure un cheval au « trot allongé » ?","Un allongement des foulées",["Un raccourcissement","Un changement de pied","Un arrêt"],"Le cheval gagne en amplitude sans accélérer la cadence."]
],[ // Galop 6
["Où se situe le Cadre noir, école d'équitation française ?","À Saumur",["À Versailles","À Chantilly","À Lyon"],"Le Cadre noir de Saumur est célèbre pour ses reprises de manège."],
["Combien un cheval a-t-il de vertèbres cervicales ?","7",["5","12","18"],"Comme chez la plupart des mammifères, y compris l'être humain."],
["Quelle race française est originaire de Camargue ?","Le cheval de Camargue",["Le Selle français","Le Percheron","Le Trotteur"],"Cheval rustique à la robe grise qui devient blanche avec l'âge."],
["Quelle articulation sépare le canon du paturon ?","Le boulet",["Le jarret","Le genou","Le grasset"],"Le boulet est essentiel pour amortir les chocs."],
["Le Pur-sang anglais est surtout utilisé pour…","Les courses de galop",["Le labour","Le trait","L'attelage lourd"],"Il est sélectionné pour la vitesse et l'endurance sur piste."]
],[ // Galop 7
["Que désigne le piaffer ?","Un trot très cadencé sur place",["Un galop rapide","Un recul","Un saut"],"C'est un mouvement de dressage de haut niveau."],
["Que fait un cheval en contre-galop ?","Il galope à droite sur un cercle à gauche",["Il galope à reculons","Il change de pied à chaque foulée","Il galope sans cavalier"],"Le cheval est volontairement sur le pied opposé à la direction."],
["Quelles trois disciplines composent le concours complet ?","Dressage, cross, saut d'obstacles",["Dressage, voltige, course","Cross, polo, attelage","Saut, endurance, reining"],"Le concours complet d'équitation (CCE) évalue la polyvalence du couple."],
["Quel est le diamètre d'une volte ?","Environ 6 mètres",["Environ 20 mètres","Environ 2 mètres","Environ 30 mètres"],"La volte est le plus petit cercle, de 6 m ou moins."],
["Quel air relevé a lieu quand le cheval se cabre en restant en équilibre sur les postérieurs ?","La levade",["Le passage","Le piaffer","La cession"],"La levade est un air relevé : les antérieurs sont repliés, les hanches très fléchies."]
]];

const $=s=>document.querySelector(s);
const card=$("#card"),levels=$("#levels");
let level=0,idx=0,score=0,list=[],answered=false;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const load=()=>{try{return JSON.parse(localStorage.getItem("galops-best")||"{}")}catch(e){return{}}};
const save=(l,s)=>{try{const b=load();if(!(l in b)||s>b[l]){b[l]=s;localStorage.setItem("galops-best",JSON.stringify(b))}}catch(e){}};

function drawLevels(){
  const best=load();
  levels.innerHTML="";
  for(let i=0;i<7;i++){
    const li=document.createElement("li");
    const b=document.createElement("button");
    b.className="lvl";b.type="button";b.setAttribute("aria-pressed",i===level);
    b.innerHTML=`<span class="rosette" style="background:${COLORS[i]}">${i+1}</span><span>Galop ${i+1}<small>${LABELS[i]}</small></span>`+
      (i in best?`<span class="best">Record ${best[i]}/5</span>`:"");
    b.onclick=()=>start(i);
    li.appendChild(b);levels.appendChild(li);
  }
}

function start(l){
  level=l;idx=0;score=0;
  list=shuffle(Q[l]).map(q=>({q:q[0],a:q[1],o:shuffle([q[1],...q[2]]),e:q[3]}));
  drawLevels();show();
}

function show(){
  answered=false;
  const it=list[idx];
  card.innerHTML=`<div class="meta"><span>Galop ${level+1}</span><span>Question ${idx+1} sur ${list.length}</span></div>
  <div class="bar"><i style="width:${idx/list.length*100}%"></i></div>
  <h2></h2><div class="opts"></div><p class="fb" hidden></p><button class="btn" hidden type="button"></button>`;
  card.querySelector("h2").textContent=it.q;
  const box=card.querySelector(".opts");
  it.o.forEach(t=>{
    const b=document.createElement("button");
    b.className="opt";b.type="button";b.textContent=t;
    b.onclick=()=>answer(b,t);
    box.appendChild(b);
  });
}

function answer(btn,t){
  if(answered)return;answered=true;
  const it=list[idx],good=t===it.a;
  if(good)score++;
  card.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.textContent===it.a)b.classList.add("ok");
    else if(b===btn)b.classList.add("ko");
  });
  const fb=card.querySelector(".fb");
  fb.hidden=false;
  fb.textContent=(good?"Bonne réponse. ":"Pas tout à fait. ")+it.e;
  const nx=card.querySelector(".btn");
  nx.hidden=false;
  nx.textContent=idx<list.length-1?"Question suivante":"Voir mon résultat";
  nx.onclick=()=>{idx++;idx<list.length?show():finish()};
  nx.focus();
}

function finish(){
  save(level,score);drawLevels();
  const msg=score===5?"Parcours sans faute !":score>=3?"Bon parcours, continue comme ça.":"Retourne en piste pour t'entraîner.";
  card.innerHTML=`<div class="res"><div class="rosette" style="background:${COLORS[level]}">${level+1}</div>
  <h2>${score} / ${list.length}</h2><p>${msg}</p>
  <button class="btn" id="again" type="button">Rejouer le Galop ${level+1}</button>
  ${level<6?`<button class="btn" id="up" type="button" style="margin-left:8px">Passer au Galop ${level+2}</button>`:""}</div>`;
  $("#again").onclick=()=>start(level);
  if($("#up"))$("#up").onclick=()=>start(level+1);
}

start(0);
</script>
</body>
</html>
